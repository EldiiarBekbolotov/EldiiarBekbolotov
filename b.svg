<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eldiiar Bekbolotov">

  <defs>
    <!-- Clip path for rounded card -->
    <clipPath id="cardClip">
      <rect x="150" y="50" width="900" height="280" rx="28" ry="28"/>
    </clipPath>

    <!-- Card blur filter (slight) -->
    <filter id="glassCard" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
    </filter>

    <!-- Text blur filter (stronger) -->
    <filter id="glassText" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
    </filter>

    <!-- Gradient for name/role text stroke -->
    <linearGradient id="textStrokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(117, 117, 117,0.4)"/>
      <stop offset="100%" stop-color="rgba(54, 54, 54,0.4)"/>
    </linearGradient>

    <!-- Gradient fill for text -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.4)"/>
    </linearGradient>
  </defs>
  <!-- Glass card with blurred background image -->
  <g clip-path="url(#cardClip)">
    <image href="https://upload.wikimedia.org/wikipedia/commons/8/8d/Tirich_Mir_%28The_Kingdom_Of_Djinns_And_Fairies%29.jpg"
           x="150" y="50" width="900" height="280" preserveAspectRatio="xMidYMid slice" filter="url(#glassCard)"/>
  </g>

  <!-- Semi-transparent overlay with border -->
  <rect x="150" y="50" width="900" height="280" rx="28" ry="28"
        fill="rgba(0,0,0,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Name and Role with stronger blur -->
  <g clip-path="url(#cardClip)">
    <!-- Sharp text shadow -->
  <text x="600" y="140" text-anchor="middle" font-family="Helvetica, arial, sans-serif" font-size="90"
        fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.25)" stroke-width="2">
    Eldiiar Bekbolotov
  </text>

  <!-- Blurred glass text on top -->
  <text x="600" y="140" text-anchor="middle" font-family="Helvetica, arial, sans-serif" font-size="90"
        fill="url(#grad)" stroke="url(#textStrokeGrad)" stroke-width="0" filter="url(#glassText)">
    Eldiiar Bekbolotov
  </text>

   <!-- Sharp text shadow -->
  <text x="600" y="180" text-anchor="middle" font-family="Helvetica, arial, sans-serif" font-size="26"
        fill="rgba(255,255,255,0.4)" stroke="rgba(255,255,255,0.2)" stroke-width="2">
    Software Engineering Contractor
  </text>

  <!-- Blurred glass text on top -->
  <text x="600" y="180" text-anchor="middle" font-family="Helvetica, arial, sans-serif" font-size="26"
        fill="url(#grad)" stroke="url(#textStrokeGrad)" stroke-width="0" filter="url(#glassText)">
    Software Engineering Contractor
  </text>
  </g>

  <!-- Skill Chips with glass blur and vertically centered text -->
  <g font-family="Helvetica, arial, sans-serif" font-size="18" text-anchor="middle">
    <g transform="translate(240,220)">
      <rect width="140" height="34" rx="17" ry="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" filter="url(#glassCard)"/>
      <text x="70" y="17" dominant-baseline="middle" fill="rgba(255,255,255,0.8)">Frontend</text>
    </g>
    <g transform="translate(390,220)">
      <rect width="140" height="34" rx="17" ry="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" filter="url(#glassCard)"/>
      <text x="70" y="17" dominant-baseline="middle" fill="rgba(255,255,255,0.8)">Backend</text>
    </g>
    <g transform="translate(540,220)">
      <rect width="160" height="34" rx="17" ry="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" filter="url(#glassCard)"/>
      <text x="80" y="17" dominant-baseline="middle" fill="rgba(255,255,255,0.8)">UI/UX Design</text>
    </g>
    <g transform="translate(710,220)">
      <rect width="220" height="34" rx="17" ry="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" filter="url(#glassCard)"/>
      <text x="110" y="17" dominant-baseline="middle" fill="rgba(255,255,255,0.8)">Competitive Programming</text>
    </g>
    <g transform="translate(290,265)">
      <rect width="140" height="34" rx="17" ry="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" filter="url(#glassCard)"/>
      <text x="70" y="17" dominant-baseline="middle" fill="rgba(255,255,255,0.8)">AI/ML</text>
    </g>
    <g transform="translate(450,265)">
      <rect width="160" height="34" rx="17" ry="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" filter="url(#glassCard)"/>
      <text x="80" y="17" dominant-baseline="middle" fill="rgba(255,255,255,0.8)">Graphic Design</text>
    </g>
    <g transform="translate(630,265)">
      <rect width="260" height="34" rx="17" ry="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" filter="url(#glassCard)"/>
      <text x="130" y="17" dominant-baseline="middle" fill="rgba(255,255,255,0.8)">Human-Computer Interaction</text>
    </g>
  </g>

</svg>
